        // Formatting Helper Component for Markdown rendering
        const FormattedText = ({ text }) => {
            if (!text) return null;
            
            const lines = text.split('\n');
            return (
                <div className="space-y-1.5">
                    {lines.map((line, idx) => {
                        if (!line.trim()) return <div key={idx} className="h-1" />;

                        // Bullet point formatting
                        if (line.trim().startsWith('•') || line.trim().startsWith('- ')) {
                            const content = line.replace(/^[•\-]\s*/, '');
                            return (
                                <div key={idx} className="flex items-start space-x-2 pl-1">
                                    <span className="text-cyan-400 font-bold">•</span>
                                    <span>{renderInlineMarkdown(content)}</span>
                                </div>
                            );
                        }

                        // Header formatting
                        if (line.trim().startsWith('### ')) {
                            return <h4 key={idx} className="font-bold text-sm text-cyan-300 mt-2 mb-1">{line.replace('### ', '')}</h4>;
                        }

                        return <p key={idx}>{renderInlineMarkdown(line)}</p>;
                    })}
                </div>
            );
        };

        const renderInlineMarkdown = (text) => {
            const parts = text.split(/(\*\*.*?\*\*|\*.*?\*|`.*?`)/g);
            return parts.map((part, index) => {
                if (part.startsWith('**') && part.endsWith('**')) {
                    return <strong key={index} className="font-extrabold text-amber-300">{part.slice(2, -2)}</strong>;
                }
                if (part.startsWith('*') && part.endsWith('*')) {
                    return <em key={index} className="italic text-slate-200">{part.slice(1, -1)}</em>;
                }
                if (part.startsWith('`') && part.endsWith('`')) {
                    return <code key={index} className="bg-black/40 px-1.5 py-0.5 rounded font-mono text-[11px] text-cyan-300 border border-cyan-500/20">{part.slice(1, -1)}</code>;
                }
                return part;
            });

You can trigger automated student productivity actions when asked (such as scheduling sessions, plan repair, email drafting, or messaging study groups).
When an action is triggered, wrap the JSON payload in a code block with 'json':
\`\`\`json

        const computeVoiceMap = (voices) => {
            if (!voices || voices.length === 0) return {};

            const engVoices = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith('en'));
            const pool = engVoices.length > 0 ? engVoices : voices;

            const MALE_KW = ['david', 'george', 'daniel', 'oliver', 'alex', 'fred', 'guy', 'james', 'richard', 'mark', 'male', 'man'];
            const FEMALE_KW = ['moira', 'fiona', 'zira', 'samantha', 'victoria', 'karen', 'aria', 'jenny', 'eva', 'hazel', 'susan', 'serena', 'stephanie', 'female', 'woman'];

            const isMaleVoice = (v) => {
                const name = v.name.toLowerCase();
                return MALE_KW.some(k => name.includes(k)) && !FEMALE_KW.some(k => name.includes(k));
            };

            const isFemaleVoice = (v) => {
                const name = v.name.toLowerCase();
                return FEMALE_KW.some(k => name.includes(k)) && !MALE_KW.some(k => name.includes(k));
            };

            const malePool = pool.filter(isMaleVoice);
            const femalePool = pool.filter(isFemaleVoice);

            const pickVoice = (preferredKeywords, voicePool, fallbackPool) => {
                for (const kw of preferredKeywords) {
                    const match = voicePool.find(v => v.name.toLowerCase().includes(kw));
                    if (match) return match;
                }
                for (const kw of preferredKeywords) {
                    const match = fallbackPool.find(v => v.name.toLowerCase().includes(kw));
                    if (match) return match;
                }
                return voicePool[0] || fallbackPool[0] || pool[0];
            };

                edith: pickVoice(['samantha', 'victoria', 'aria', 'jenny', 'zira', 'karen'], femalePool, pool),
                karen: pickVoice(['karen', 'serena', 'hazel', 'susan', 'zira'], femalePool, pool),
                taras: pickVoice(['alex', 'fred', 'david', 'guy', 'mark'], malePool, pool)
            };
        };

        function App() {
            // Persistent Theme & Voice States
            const [currentThemeKey, setCurrentThemeKey] = useState(() => localStorage.getItem("vocent_theme") || "cyberNeon");
            const [selectedAssistantKey, setSelectedAssistantKey] = useState(() => localStorage.getItem("vocent_assistant") || "jarvis");
            const [systemVoices, setSystemVoices] = useState([]);
            const [manualOverrides, setManualOverrides] = useState({});
            const [isSpeaking, setIsSpeaking] = useState(false);
            const [currentSpeakingId, setCurrentSpeakingId] = useState(null);
            const [autoReadVoice, setAutoReadVoice] = useState(true);

            // Active Utterance Ref
            const activeUtteranceRef = useRef(null);

            // API Key State with Sync
            const [apiKey, setApiKey] = useState(() => localStorage.getItem("vocent_gemini_api_key") || "");
            const [inputApiKey, setInputApiKey] = useState(apiKey);

            // Voice Dictation (Speech-to-Text) State
            const [isListening, setIsListening] = useState(false);
            const recognitionRef = useRef(null);

            // Toast / Notification State
            const [toastMessage, setToastMessage] = useState(null);

            // Tab & Chat States
            const [activeTab, setActiveTab] = useState("chat");
            const [chatInput, setChatInput] = useState("");
            const [chatMessages, setChatMessages] = useState([
                {
                    id: 1,
                    sender: "mentor",
                    assistantKey: selectedAssistantKey,
                    text: MARVEL_ASSISTANTS[selectedAssistantKey]?.greeting || MARVEL_ASSISTANTS.jarvis.greeting,
                    timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                }
            ]);
            const [geminiHistory, setGeminiHistory] = useState([]);
            const [isLoading, setIsLoading] = useState(false);

            // Trinity Engine States
            const [timeLeft, setTimeLeft] = useState(120);
            const [timerActive, setTimerActive] = useState(false);
            const [activeWarmupProblem, setActiveWarmupProblem] = useState("Calculate the electric field at point P due to a point charge of +5μC at a distance of 0.3m.");
            const [calendarEvents, setCalendarEvents] = useState([
                { id: 1, title: "Physics: Thermodynamics Review", time: "Today • 6:00 PM - 7:00 PM", status: "Scheduled" },
                { id: 2, title: "Maths: Calculus Integration Drills", time: "Tomorrow • 5:00 PM - 6:30 PM", status: "Upcoming" }
            ]);
            const [planRepaired, setPlanRepaired] = useState(false);

            // Autopsy Vision AI States
            const [autopsyTag, setAutopsyTag] = useState("silly");
            const [autopsyResult, setAutopsyResult] = useState(null);
            const [selectedAutopsyImage, setSelectedAutopsyImage] = useState(null);
            const [autopsyImagePreview, setAutopsyImagePreview] = useState(null);
            const fileInputRef = useRef(null);

            // Modal States
            const [whatsappModal, setWhatsappModal] = useState({ open: false, phone: "", message: "" });
            const [emailModal, setEmailModal] = useState({ open: false, to: "", subject: "", body: "" });
            const [showVoiceModal, setShowVoiceModal] = useState(false);

            const chatContainerRef = useRef(null);

            const theme = THEMES[currentThemeKey] || THEMES.cyberNeon;
            const currentAssistant = MARVEL_ASSISTANTS[selectedAssistantKey] || MARVEL_ASSISTANTS.jarvis;

            const showNotification = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 4000);
            };

            // Save Theme & Assistant in LocalStorage
            useEffect(() => {
                localStorage.setItem("vocent_theme", currentThemeKey);
            }, [currentThemeKey]);

            useEffect(() => {
                localStorage.setItem("vocent_assistant", selectedAssistantKey);
            }, [selectedAssistantKey]);

            const handleSaveApiKey = (keyToSave) => {
                const trimmed = (keyToSave || "").trim();
                setApiKey(trimmed);
                setInputApiKey(trimmed);
                if (trimmed) {
                    localStorage.setItem("vocent_gemini_api_key", trimmed);
                    showNotification("✓ Gemini API Key saved! Live AI mentor responses enabled.");
                } else {
                    localStorage.removeItem("vocent_gemini_api_key");
                    showNotification("API Key cleared. App switched to Demo Mode.");
                }
            };

            useEffect(() => {
                const updateVoices = () => {
                    if ('speechSynthesis' in window) {
                        try {
                            const voices = window.speechSynthesis.getVoices();
                            if (voices && voices.length > 0) {
                                setSystemVoices(voices);
                            }
                        } catch (e) {
                            console.warn("SpeechSynthesis voices load issue:", e);
                        }
                    }
                };

                updateVoices();
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.onvoiceschanged = updateVoices;
                }
                return () => {
                    if ('speechSynthesis' in window) {
                        window.speechSynthesis.onvoiceschanged = null;
                    }
                };
            }, []);

            const lockedVoiceMap = useMemo(() => {
                return computeVoiceMap(systemVoices);
            }, [systemVoices]);

            useEffect(() => {
                try {
                    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                    if (SpeechRecognition) {
                        const recognition = new SpeechRecognition();
                        recognition.continuous = false;
                        recognition.interimResults = true;
                        recognition.lang = 'en-US';

                        recognition.onresult = (event) => {
                            const transcript = Array.from(event.results)
                                .map(result => result[0].transcript)
                                .join('');
                            setChatInput(transcript);
                        };

                        recognition.onerror = (event) => {
                            console.warn('Speech recognition error:', event.error);
                            setIsListening(false);
                            if (event.error === 'not-allowed') {
                                showNotification("Microphone access blocked. Please grant microphone permissions in browser.");
                            }
                        };

                        recognition.onend = () => {
                            setIsListening(false);
                        };

                        recognitionRef.current = recognition;
                    }
                } catch (err) {
                    console.warn("SpeechRecognition initialization skipped:", err);
                }
            }, []);

            const toggleListening = () => {
                if (!recognitionRef.current) {
                    showNotification("Speech recognition is not supported in this browser. Try Chrome or Edge!");
                    return;
                }
                if (isListening) {
                    recognitionRef.current.stop();
                    setIsListening(false);
                } else {
                    try {
                        recognitionRef.current.start();
                        setIsListening(true);
                    } catch (e) {
                        console.warn("Recognition start error:", e);
                        setIsListening(false);
                    }
                }
            };

            const stopSpeech = useCallback(() => {
                if ('speechSynthesis' in window) {
                    try {
                        window.speechSynthesis.cancel();
                    } catch (e) {
                        console.warn("Speech cancel error:", e);
                    }
                }
                activeUtteranceRef.current = null;
                setIsSpeaking(false);
                setCurrentSpeakingId(null);
            }, []);

            const speakText = useCallback((textToSpeak, msgId = null, targetAssistantKey = null) => {
                stopSpeech();

                if (!('speechSynthesis' in window)) {
                    console.warn("Speech synthesis is not supported in this browser environment.");
                    return;
                }

                const assistantKeyToUse = targetAssistantKey || selectedAssistantKey;
                const assistant = MARVEL_ASSISTANTS[assistantKeyToUse] || MARVEL_ASSISTANTS.jarvis;

                let cleanSpeechText = textToSpeak
                    .replace(/```[\s\S]*?```/g, '')
                    .replace(/`([^`]+)`/g, '$1')
                    .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
                    .replace(/[\*\#\_\~\>\-\+]/g, ' ')
                    .replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu, '')
                    .replace(/J\.A\.R\.V\.I\.S\./gi, 'Jarvis')
                    .replace(/F\.R\.I\.D\.A\.Y\./gi, 'Friday')
                    .replace(/E\.D\.I\.T\.H\./gi, 'Edith')
                    .replace(/K\.A\.R\.E\.N\./gi, 'Karen')
                    .replace(/T\.A\.R\.A\.S\./gi, 'Taras')
                    .replace(/\s+/g, ' ')
                    .trim();

                if (!cleanSpeechText) return;

                try {
                    const utterance = new SpeechSynthesisUtterance(cleanSpeechText);
                    activeUtteranceRef.current = utterance;

                    utterance.pitch = assistant.pitch;
                    utterance.rate = assistant.rate;
                    utterance.lang = 'en-US';

                    let voiceToUse = null;
                    if (manualOverrides[assistantKeyToUse]) {
                        voiceToUse = systemVoices.find(v => v.name === manualOverrides[assistantKeyToUse]);
                    }
                    if (!voiceToUse) {
                        voiceToUse = lockedVoiceMap[assistantKeyToUse];
                    }

                    if (voiceToUse) {
                        utterance.voice = voiceToUse;
                    }

                    utterance.onstart = () => {
                        setIsSpeaking(true);
                        setCurrentSpeakingId(msgId);
                    };

                    utterance.onend = () => {
                        setIsSpeaking(false);
                        setCurrentSpeakingId(null);
                        activeUtteranceRef.current = null;
                    };

                    utterance.onerror = (e) => {
                        console.warn("TTS Speech error:", e);
                        setIsSpeaking(false);
                        setCurrentSpeakingId(null);
                        activeUtteranceRef.current = null;
                    };

                    window.speechSynthesis.speak(utterance);
                } catch (err) {
                    console.warn("TTS execution failed:", err);
                }
            }, [stopSpeech, selectedAssistantKey, manualOverrides, systemVoices, lockedVoiceMap]);

            const handleAssistantChange = (newKey) => {
                stopSpeech();
                setSelectedAssistantKey(newKey);

                const newAssistant = MARVEL_ASSISTANTS[newKey] || MARVEL_ASSISTANTS.jarvis;
                const newMsgId = Date.now();

                const switchMsg = {
                    id: newMsgId,
                    sender: "mentor",
                    assistantKey: newKey,
                    text: newAssistant.greeting,
                    timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                };

                setChatMessages(prev => [...prev, switchMsg]);

                if (autoReadVoice) {
                    setTimeout(() => {
                        speakText(newAssistant.greeting, newMsgId, newKey);
                    }, 120);
                }
            };

            useEffect(() => {
                if (chatContainerRef.current) {
                    chatContainerRef.current.scrollTop = chatContainerRef.current.scrollHeight;
                }
            }, [chatMessages, isLoading]);

            useEffect(() => {
                let interval = null;
                if (timerActive && timeLeft > 0) {
                    interval = setInterval(() => setTimeLeft(prev => prev - 1), 1000);
                } else if (timeLeft === 0) {
                    setTimerActive(false);
                    showNotification("⏰ 2-Minute Sprint Completed! Great active focus!");
                }
                return () => clearInterval(interval);
            }, [timerActive, timeLeft]);

            const formatTime = (seconds) => {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            };

            const generateDemoAssistantResponse = (userText) => {
                const lower = userText.toLowerCase();
                const assistant = MARVEL_ASSISTANTS[selectedAssistantKey] || MARVEL_ASSISTANTS.jarvis;
                const bossTerm = assistant.id === 'jarvis' || assistant.id === 'friday' ? 'Boss' : assistant.id === 'edith' ? 'Agent' : assistant.id === 'karen' ? 'friend' : 'Candidate';

                if (lower.includes("schedule") || lower.includes("study session") || lower.includes("practice block")) {
                    return `Certainly ${bossTerm}! I have configured a targeted practice session based on your current focus areas.\n\`\`\`json\n{\n  "hasAction": true,\n  "actionType": "calendar_add",\n  "actionTitle": "Physics Conceptual Practice",\n  "actionDetails": "45-minute active recall drill covering Electromagnetic Induction & Gauss Law."\n}\n\`\`\``;
                }
                if (lower.includes("whatsapp") || lower.includes("group") || lower.includes("message")) {
                    return `Copy that ${bossTerm}! Here is the prepared update message for your study circle ready to broadcast:\n\`\`\`json\n{\n  "hasAction": true,\n  "actionType": "whatsapp_send",\n  "actionTitle": "WhatsApp Study Circle Alert",\n  "actionDetails": "Send revision notice to your study squad.",\n  "draftText": "Hey team! Remind everyone we are revising Organic Chemistry reaction mechanisms tomorrow at 5 PM sharp. Bring your formula sheets!"\n}\n\`\`\``;
                }
                if (lower.includes("email") || lower.includes("teacher") || lower.includes("doubt")) {
                    return `Draft generated and ready for review ${bossTerm}:\n\`\`\`json\n{\n  "hasAction": true,\n  "actionType": "email_draft",\n  "actionTitle": "Doubt Clarification Request",\n  "recipient": "physics.teacher@school.edu",\n  "actionDetails": "Polite inquiry regarding integration application in Kinematics.",\n  "draftText": "Dear Teacher,\\n\\nI was reviewing today's physics lecture on Kinematics and had a minor doubt regarding variable acceleration integration.\\n\\nCould I stop by during office hours for 5 minutes?\\n\\nBest regards."\n}\n\`\`\``;
                }
                if (lower.includes("missed") || lower.includes("repair") || lower.includes("backlog")) {
                    return `Analyzing missed schedule blocks... I have devised a non-fatiguing redistribution plan to cover the backlog without burnout!\n\`\`\`json\n{\n  "hasAction": true,\n  "actionType": "plan_repair",\n  "actionTitle": "Smart Backlog Redistribution",\n  "actionDetails": "Split 2 missed study hours into two 30-minute light micro-slots over Thursday & Friday."\n}\n\`\`\``;
                }

                return `💡 [Demo Mode Active]\n\nUnderstood ${bossTerm}! To get live custom AI answers to any question, please tap "Set Key" or open Settings to enter your Google Gemini API Key.\n\nIn the meantime, try asking me to "schedule a study session", "repair missed schedule", "draft a WhatsApp message", or "email teacher"!`;
            };

            const callGeminiAPI = async (userText, updatedHistory) => {
                const currentKey = apiKey || localStorage.getItem("vocent_gemini_api_key") || "";
                
                if (!currentKey) {
                    await new Promise(res => setTimeout(res, 600));
                    return generateDemoAssistantResponse(userText);
                }

                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${currentKey}`;

                const payload = {
                    contents: updatedHistory,
                    systemInstruction: {
                        parts: [{ text: getSystemInstruction(selectedAssistantKey) }]
                    }
                };

                let retries = 0;
                let delay = 1000;

                while (retries < 3) {
                    try {
                        const response = await fetch(apiUrl, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });

                        if (!response.ok) {
                            const errData = await response.json().catch(() => ({}));
                            throw new Error(`API Error ${response.status}: ${errData.error?.message || response.statusText}`);
                        }

                        const data = await response.json();
                        const candidate = data.candidates?.[0];
                        const text = candidate?.content?.parts?.[0]?.text;

                        if (text) return text;
                        throw new Error("Invalid response structure");
                    } catch (err) {
                        console.warn("Gemini API call attempt failed:", err);
                        retries++;
                        if (retries >= 3) {
                            showNotification("Gemini API key error or connection timeout. Falling back to Demo Mode.");
                            return generateDemoAssistantResponse(userText);
                        }
                        await new Promise(res => setTimeout(res, delay));
                        delay *= 2;
                    }
                }
            };

            const handleSendMessage = async (customPrompt) => {
                const currentText = customPrompt || chatInput;
                if (!currentText.trim() || isLoading) return;

                if (isListening) {
                    recognitionRef.current?.stop();
                    setIsListening(false);
                }

                setChatInput("");
                stopSpeech();

                const userMsg = {
                    id: Date.now(),
                    sender: "user",
                    text: currentText,
                    timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                };

                setChatMessages(prev => [...prev, userMsg]);
                setIsLoading(true);

                const newHistoryTurn = { role: "user", parts: [{ text: currentText }] };
                const updatedHistory = [...geminiHistory, newHistoryTurn];

                try {
                    const rawAiResponse = await callGeminiAPI(currentText, updatedHistory);

                    let cleanText = rawAiResponse;
                    let parsedAction = null;

                    const jsonMatch = rawAiResponse.match(/```json\s*([\s\S]*?)\s*```/);
                    if (jsonMatch && jsonMatch[1]) {
                        try {
                            parsedAction = JSON.parse(jsonMatch[1]);
                            cleanText = rawAiResponse.replace(/```json\s*[\s\S]*?\s*```/, '').trim();
                        } catch (pErr) {
                            console.warn("Action card JSON parse skipped:", pErr);
                        }
                    }

                    setGeminiHistory([...updatedHistory, { role: "model", parts: [{ text: rawAiResponse }] }]);

                    const botMsgId = Date.now() + 1;
                    const botMsg = {
                        id: botMsgId,
                        sender: "mentor",
                        assistantKey: selectedAssistantKey,
                        text: cleanText,
                        actionCard: parsedAction?.hasAction ? parsedAction : null,
                        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                    };

                    setChatMessages(prev => [...prev, botMsg]);

                    if (autoReadVoice) {
                        speakText(cleanText, botMsgId, selectedAssistantKey);
                    }
                } catch (err) {
                    console.error("Gemini API Error:", err);
                    setChatMessages(prev => [
                        ...prev,
                        {
                            id: Date.now() + 1,
                            sender: "mentor",
                            assistantKey: selectedAssistantKey,
                            text: "I encountered a minor connection pause. Please re-check your connection or API key and try again!",
                            timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                        }
                    ]);
                } finally {
                    setIsLoading(false);
                }
            };

            const handleApplyAction = (msgId, action) => {
                setChatMessages(prev => prev.map(m => {
                    if (m.id === msgId && m.actionCard) {
                        return { ...m, actionCard: { ...m.actionCard, applied: true } };
                    }
                    return m;
                }));

                if (action.actionType === 'warmup_timer') {
                    if (action.warmupProblem) setActiveWarmupProblem(action.warmupProblem);
                    setTimeLeft(120);
                    setTimerActive(true);
                    setActiveTab("trinity");
                    showNotification("🚀 2-Minute Warmup Sprint started!");
                } else if (action.actionType === 'plan_repair') {
                    setPlanRepaired(true);
                    setActiveTab("trinity");
                    showNotification("✓ Backlog schedule repaired!");
                } else if (action.actionType === 'calendar_add') {
                    setCalendarEvents(prev => [...prev, {
                        id: Date.now(),
                        title: action.actionTitle || "AI Target Session",
                        time: "Upcoming Target",
                        status: "Confirmed"
                    }]);
                    setActiveTab("trinity");
                    showNotification("📅 Target session added to calendar!");
                } else if (action.actionType === 'whatsapp_send') {
                    setWhatsappModal({
                        open: true,
                        phone: action.recipient || "",
                        message: action.draftText || action.actionDetails || ""
                    });
                } else if (action.actionType === 'email_draft') {
                    setEmailModal({
                        open: true,
                        to: action.recipient || "",
                        subject: action.actionTitle || "Academic Study Note",
                        body: action.draftText || action.actionDetails || ""
                    });
                }
            };

            // Image Upload Handler for Autopsy
            const handleImageSelect = (e) => {
                const file = e.target.files?.[0];
                if (file) {
                    setSelectedAutopsyImage(file);
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setAutopsyImagePreview(reader.result);
                    };
                    reader.readAsDataURL(file);
                    showNotification("📷 Mock Test Image loaded! Ready for Autopsy.");
                }
            };

            const runErrorDiagnosis = async () => {
                const tagLabels = {
                    concept: "Concept Gap (Formula / Core Theory)",
                    silly: "Silly Slip (Calculation or Sign Mistake)",
                    time: "Time Pressure Rush / Panic",
                    misread: "Misread Question Data"
                };

                if (apiKey && selectedAutopsyImage && autopsyImagePreview) {
                    setIsLoading(true);
                    try {
                        const base64Data = autopsyImagePreview.split(',')[1];
                        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;

                        const payload = {
                            contents: [{
                                parts: [
                                    { text: `Analyze this student mock test mistake image. Tag category: ${tagLabels[autopsyTag]}. Provide a concise diagnostic breakdown with cause, conceptual correction, and schedule adjustment.` },
                                    { inline_data: { mime_type: selectedAutopsyImage.type || "image/jpeg", data: base64Data } }
                                ]
                            }]
                        };

                        const response = await fetch(apiUrl, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });

                        const data = await response.json();
                        const visionText = data.candidates?.[0]?.content?.parts?.[0]?.text;

                        if (visionText) {
                            setAutopsyResult({
                                cause: `${tagLabels[autopsyTag]} (Vision AI Verified)`,
                                recommendation: visionText,
                                suggestedAction: "Added 15-minute diagnostic drill block to tomorrow's schedule."
                            });
                            setIsLoading(false);
                            return;
                        }
                    } catch (err) {
                        console.warn("Vision API diagnosis fallback:", err);
                    }
                    setIsLoading(false);
                }

                // Default Fallback / Demo Diagnosis
                setAutopsyResult({
                    cause: tagLabels[autopsyTag] || "Silly Calculation / Sign Mistake",
                    recommendation: "Re-derive the problem step without looking at hints. Attempt 3 similar practice questions on active recall.",
                    suggestedAction: "Added 15-minute diagnostic drill block to tomorrow's schedule."
                });
            };

            const executeWhatsAppLaunch = () => {
                const encodedMsg = encodeURIComponent(whatsappModal.message);
                const url = whatsappModal.phone 
                    ? `https://api.whatsapp.com/send?phone=${whatsappModal.phone.replace(/[^0-9]/g, '')}&text=${encodedMsg}`
                    : `https://api.whatsapp.com/send?text=${encodedMsg}`;
                window.open(url, '_blank');
                setWhatsappModal({ open: false, phone: "", message: "" });
            };

            const executeEmailLaunch = () => {
                const url = `mailto:${emailModal.to}?subject=${encodeURIComponent(emailModal.subject)}&body=${encodeURIComponent(emailModal.body)}`;
                window.location.href = url;
                setEmailModal({ open: false, to: "", subject: "", body: "" });
            };

            return (
                <div className={`min-h-screen ${theme.bg} ${theme.textPrimary} flex flex-col font-sans transition-colors duration-300 relative`}>
                    
                    {/* Toast Notification Banner */}
                    {toastMessage && (
                        <div className="fixed top-4 right-4 z-50 bg-amber-500 text-slate-950 font-bold px-4 py-2.5 rounded-2xl shadow-xl flex items-center space-x-2 text-xs border border-amber-300 animate-float">
                            <span>ℹ️️ {toastMessage}</span>
                            <button onClick={() => setToastMessage(null)} className="ml-2 text-slate-900 hover:text-white font-extrabold" aria-label="Close notification">✕</button>
                        </div>
                    )}

                    {/* Header */}
                    <header className={`border-b ${theme.cardBorder} ${theme.cardBg} ${theme.glow} px-4 py-3 sticky top-0 z-30 flex items-center justify-between shadow-md`}>
                        <div className="flex items-center space-x-3">
                            <div className="flex items-center justify-center p-1.5 rounded-2xl bg-black/30 border border-cyan-500/30 shadow-inner group">
                                <VocentLogo className="w-8 h-8 md:w-9 md:h-9 transform group-hover:scale-105 transition-transform" />
                            </div>
                            <div>
                                <h1 className="font-heading font-extrabold text-xl md:text-2xl tracking-tight flex items-center space-x-2">
                                    <span className="bg-gradient-to-r from-white via-slate-100 to-cyan-300 bg-clip-text text-transparent">
                                        Vocent
                                    </span>
                                    <span className={`text-[10px] font-sans font-bold px-2.5 py-0.5 rounded-full border ${theme.badgeBg} ${theme.badgeText} uppercase tracking-wider`}>
                                        AI Mentor
                                    </span>
                                </h1>
                                <p className={`text-[11px] ${theme.textSecondary} font-medium font-sans`}>
                                    AI Student Mentor & Productivity Automation Engine
                                </p>
                            </div>
                        </div>

                        {/* Top Controls */}
                        <div className="flex items-center space-x-2">
                            
                            {/* API Key Status Indicator */}
                            <button 
                                onClick={() => {
                                    setInputApiKey(apiKey);
                                    setShowVoiceModal(true);
                                }}
                                className={`px-2.5 py-1.5 rounded-xl border text-[11px] font-mono font-bold flex items-center space-x-1.5 transition-all ${
                                    apiKey

                                        )}
                                    </div>

                                    <div className="p-4 rounded-2xl border border-white/10 bg-black/30 space-y-3">
                                        <p className="text-xs font-bold text-slate-200">Select Mistake Pattern Tag:</p>
                                        <div className="grid grid-cols-2 md:grid-cols-4 gap-2.5">
                                            {[
                                                { id: "concept", label: "Concept Gap", color: "bg-red-500/20 text-red-300 border-red-500/30" },
                                                { id: "silly", label: "Silly Slip (Calculation)", color: "bg-amber-500/20 text-amber-300 border-amber-500/30" },
                                                { id: "time", label: "Time Pressure Panic", color: "bg-purple-500/20 text-purple-300 border-purple-500/30" },
                                                { id: "misread", label: "Misread Question Data", color: "bg-blue-500/20 text-blue-300 border-blue-500/30" }
                                            ].map((tag) => (
                                                <button 
                                                    key={tag.id}
                                                    onClick={() => setAutopsyTag(tag.id)}
                                                    className={`p-3 rounded-2xl border text-xs font-semibold transition-all text-center ${tag.color} ${autopsyTag === tag.id ? 'ring-2 ring-cyan-400 scale-[1.02]' : 'opacity-70 hover:opacity-100'}`}
                                                >
                                                    {tag.label}
                                                </button>
                                            ))}
                                        </div>

                                        <div className="pt-2 flex justify-end">
                                            <button 
                                                onClick={runErrorDiagnosis}
                                                disabled={isLoading}
                                                className={`px-6 py-2.5 rounded-2xl ${theme.accentBg} text-white text-xs font-bold shadow-md hover:scale-105 transition-transform flex items-center space-x-2`}
                                            >
                                                {isLoading ? <Icon name="cpu" className="w-4 h-4 animate-spin" /> : <Icon name="camera" className="w-4 h-4" />}
                                                <span>Run AI Autopsy Diagnosis</span>
                                            </button>
                                        </div>
                                    </div>

                                    {autopsyResult && (
                                        <div className="p-5 rounded-2xl border border-emerald-500/40 bg-emerald-950/30 text-xs space-y-2 animate-float font-mono shadow-inner">
                                            <div className="text-emerald-400 font-bold text-sm">Autopsy Result: {autopsyResult.cause}</div>
                                            <div className="text-slate-200">
                                                <strong>Recommendation:</strong>
                                                <FormattedText text={autopsyResult.recommendation} />
                                            </div>
                                            <p className="text-slate-200 pt-1 border-t border-white/10">• <strong>Schedule Adjustment:</strong> {autopsyResult.suggestedAction}</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                    </main>

                    {/* Settings & Voice Modal */}
                    {showVoiceModal && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
                            <div className={`max-w-md w-full rounded-3xl border ${theme.cardBorder} ${theme.cardBg} p-6 space-y-5 shadow-2xl`}>
                                <div className="flex justify-between items-center border-b border-white/10 pb-3">
                                    <h3 className="text-sm font-bold flex items-center space-x-2 text-cyan-400 font-heading">
                                        <Icon name="settings" className="w-5 h-5" />
                                        <span>AI Engine & Voice Settings</span>
                                    </h3>
                                    <button onClick={() => setShowVoiceModal(false)} className="text-slate-400 hover:text-white text-xs font-bold" aria-label="Close modal">✕</button>
                                </div>

                                {/* API Key Section */}
                                <div className="p-4 rounded-2xl border border-amber-500/30 bg-black/40 space-y-2.5 text-xs">
                                    <div className="flex items-center justify-between">
                                        <span className="font-bold text-amber-300 flex items-center space-x-1.5">
                                            <Icon name="key" className="w-4 h-4 text-amber-400" />
                                            <span>Google Gemini API Key</span>
                                        </span>
                                        <span className={`text-[10px] px-2 py-0.5 rounded font-mono font-bold ${apiKey ? 'bg-emerald-500/20 text-emerald-300' : 'bg-amber-500/20 text-amber-300'}`}>
                                            {apiKey ? 'Active' : 'Demo Mode'}
                                        </span>
                                    </div>

                                    <p className="text-slate-400 text-[11px] leading-relaxed">
                                        Paste your key below to unlock live, unscripted responses from Gemini. Stored securely in your browser local storage.
                                    </p>

                                    <div className="flex space-x-2">
                                        <input 
                                            type="password"
                                            placeholder="AIzaSy..."
                                            value={inputApiKey}
                                            onChange={(e) => setInputApiKey(e.target.value)}
                                            className="flex-1 px-3 py-2 rounded-xl border border-white/10 bg-black/60 text-slate-100 font-mono text-xs focus:outline-none focus:ring-1 focus:ring-amber-400"
                                        />
                                        <button 
                                            onClick={() => handleSaveApiKey(inputApiKey)}
                                            className="px-4 py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs shadow"
                                        >
                                            Save
                                        </button>
                                    </div>
                                </div>

                                {/* Voice Section */}
                                <div className="space-y-3 text-xs">
                                    <p className="text-slate-300">
                                        Detected <strong>{systemVoices.length}</strong> system voices on your device.
                                    </p>

                                    <div>
                                        <label className="block text-slate-300 mb-1 font-medium">Manual Voice Override for {currentAssistant.spokenName}:</label>
                                        <select 
                                            value={manualOverrides[selectedAssistantKey] || ""}
                                            onChange={(e) => {
                                                const val = e.target.value;
                                                setManualOverrides(prev => ({
                                                    ...prev,
                                                    [selectedAssistantKey]: val
                                                }));
                                            }}
                                            className="w-full px-3 py-2 rounded-xl border border-white/10 bg-black/50 text-slate-100 text-xs focus:outline-none"
                                            aria-label="Manual Voice Override"
                                        >
                                            <option value="">Auto-Locked Match ({lockedVoiceMap[selectedAssistantKey]?.name || "System Standard"})</option>
                                            {systemVoices.map((v, i) => (
                                                <option key={i} value={v.name}>{v.name} ({v.lang})</option>
                                            ))}
                                        </select>
                                    </div>

                                    <div className="p-3 rounded-xl bg-black/30 border border-white/10 font-mono text-[11px] space-y-1">
                                        <p className="text-amber-300 font-bold">Active Assistant Profile:</p>
                                        <p>• Profile: {currentAssistant.fullName}</p>
                                        <p>• Role: {currentAssistant.title}</p>
                                    </div>
                                </div>

                                <div className="pt-2 flex justify-end">
                                    <button 
                                        onClick={() => setShowVoiceModal(false)}
                                        className={`px-5 py-2 rounded-xl ${theme.accentBg} text-white font-bold text-xs shadow`}
                                    >
                                        Done
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* WhatsApp Action Modal */}
                    {whatsappModal.open && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
                            <div className={`max-w-md w-full rounded-3xl border ${theme.cardBorder} ${theme.cardBg} p-6 space-y-4 shadow-2xl`}>
                                <div className="flex justify-between items-center border-b border-white/10 pb-3">
                                    <h3 className="text-sm font-bold flex items-center space-x-2 text-emerald-400 font-heading">
                                        <Icon name="whatsapp" className="w-5 h-5" />
                                        <span>Send WhatsApp Message</span>
                                    </h3>
                                    <button onClick={() => setWhatsappModal({ open: false, phone: "", message: "" })} className="text-slate-400 hover:text-white text-xs font-bold" aria-label="Close WhatsApp Modal">✕</button>
                                </div>

                                <div className="space-y-3 text-xs">
                                    <div>
                                        <label className="block text-slate-300 mb-1 font-medium">Recipient Phone (Optional):</label>
                                        <input 
                                            type="text" 
                                            placeholder="+1234567890" 
                                            value={whatsappModal.phone} 
                                            onChange={(e) => setWhatsappModal({ ...whatsappModal, phone: e.target.value })}
                                            className="w-full px-3 py-2 rounded-xl border border-white/10 bg-black/50 text-slate-100 focus:outline-none font-mono"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-slate-300 mb-1 font-medium">Message Draft:</label>
                                        <textarea 
                                            rows="4" 
                                            value={whatsappModal.message} 
                                            onChange={(e) => setWhatsappModal({ ...whatsappModal, message: e.target.value })}
                                            className="w-full px-3 py-2 rounded-xl border border-white/10 bg-black/50 text-slate-100 focus:outline-none"
                                        />
                                    </div>
                                </div>

                                <div className="flex justify-end space-x-2 pt-2">
                                    <button 
                                        onClick={() => setWhatsappModal({ open: false, phone: "", message: "" })}
                                        className="px-4 py-2 rounded-xl border border-white/10 text-slate-300 text-xs font-medium"
                                    >
                                        Cancel
                                    </button>
                                    <button 
                                        onClick={executeWhatsAppLaunch}
                                        className="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold flex items-center space-x-1.5 shadow"
                                    >
                                        <Icon name="whatsapp" className="w-4 h-4" />
                                        <span>Open WhatsApp</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Email Draft Action Modal */}
                    {emailModal.open && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
                            <div className={`max-w-md w-full rounded-3xl border ${theme.cardBorder} ${theme.cardBg} p-6 space-y-4 shadow-2xl`}>
                                <div className="flex justify-between items-center border-b border-white/10 pb-3">
                                    <h3 className="text-sm font-bold flex items-center space-x-2 text-indigo-400 font-heading">
                                        <Icon name="mail" className="w-5 h-5" />
                                        <span>Send Email Request</span>
                                    </h3>
                                    <button onClick={() => setEmailModal({ open: false, to: "", subject: "", body: "" })} className="text-slate-400 hover:text-white text-xs font-bold" aria-label="Close Email Modal">✕</button>
                                </div>

                                <div className="space-y-3 text-xs">
                                    <div>
                                        <label className="block text-slate-300 mb-1 font-medium">To:</label>
                                        <input 
                                            type="email" 
                                            placeholder="teacher@school.edu" 
                                            value={emailModal.to} 
                                            onChange={(e) => setEmailModal({ ...emailModal, to: e.target.value })}
                                            className="w-full px-3 py-2 rounded-xl border border-white/10 bg-black/50 text-slate-100 focus:outline-none font-mono"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-slate-300 mb-1 font-medium">Subject:</label>
                                        <input 
                                            type="text" 
                                            value={emailModal.subject} 
                                            onChange={(e) => setEmailModal({ ...emailModal, subject: e.target.value })}
                                            className="w-full px-3 py-2 rounded-xl border border-white/10 bg-black/50 text-slate-100 focus:outline-none"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-slate-300 mb-1 font-medium">Body:</label>
                                        <textarea 
                                            rows="4" 
                                            value={emailModal.body} 
                                            onChange={(e) => setEmailModal({ ...emailModal, body: e.target.value })}
                                            className="w-full px-3 py-2 rounded-xl border border-white/10 bg-black/50 text-slate-100 focus:outline-none"
                                        />
                                    </div>
                                </div>

                                <div className="flex justify-end space-x-2 pt-2">
                                    <button 
                                        onClick={() => setEmailModal({ open: false, to: "", subject: "", body: "" })}
                                        className="px-4 py-2 rounded-xl border border-white/10 text-slate-300 text-xs font-medium"
                                    >
                                        Cancel
                                    </button>
                                    <button 
                                        onClick={executeEmailLaunch}
                                        className="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold flex items-center space-x-1.5 shadow"
                                    >
                                        <Icon name="mail" className="w-4 h-4" />
                                        <span>Open Mail Client</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        // Mount Root Element
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
